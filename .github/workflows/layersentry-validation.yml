name: LayerSentry Validation

on:
  push:
    branches:
      - feat/layersentry-ui-rebrand
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint build and brand safety
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Ensure Yarn Classic
        run: |
          npm install --global yarn@1.22.22
          node --version
          yarn --version

      - name: Frozen dependency install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build LayerSentry extension package
        run: yarn build-pkg harvester

      - name: Validate generated package
        run: |
          set -euo pipefail
          out='dist-pkg/harvester-1.10.0-dev'
          entry="$out/harvester-1.10.0-dev.umd.min.js"
          test -d "$out"
          test -s "$entry"
          count=$(find "$out" -type f | wc -l)
          bytes=$(stat -c '%s' "$entry")
          echo "Generated files: $count"
          echo "UMD entrypoint bytes: $bytes"
          test "$count" -gt 1
          test "$bytes" -gt 1000000

      - name: Validate LayerSentry presentation contract
        run: |
          set -euo pipefail
          test -s pkg/harvester/assets/layersentry/layer-sentry-icon.svg
          test -s pkg/harvester/assets/layersentry/layer-sentry-logo.svg
          test -s pkg/harvester/config/layersentry-cluster.js
          test -s pkg/harvester/l10n/layersentry-en-us.yaml
          test -s pkg/harvester/styles/layersentry/index.scss

          grep -q "PRODUCT_NAME = 'harvester'" pkg/harvester/config/harvester.ts
          grep -q 'layer-sentry-icon.svg' pkg/harvester/config/harvester.ts
          grep -q 'LayerSentry enterprise HCI' pkg/harvester/package.json
          grep -q 'catalog.cattle.io/display-name.*LayerSentry' pkg/harvester/package.json
          grep -q 'feat/layersentry-ui-rebrand/pkg/harvester/icon.svg' pkg/harvester/package.json
          grep -q 'LayerSentry Cluster:' pkg/harvester/l10n/layersentry-en-us.yaml
          grep -q 'LayerSentry Monitoring' pkg/harvester/l10n/layersentry-en-us.yaml
          grep -q 'LayerSentry Support' pkg/harvester/l10n/layersentry-en-us.yaml
          grep -q 'LayerSentry' dist-pkg/harvester-1.10.0-dev/harvester-1.10.0-dev.umd.min.js

          echo 'LayerSentry brand markers and internal compatibility identifiers are valid.'

      - name: Guard known operator-facing upstream labels
        run: |
          set -euo pipefail
          overlay='pkg/harvester/l10n/layersentry-en-us.yaml'
          grep -q "productLabel: LayerSentry" "$overlay"
          grep -q "header: 'LayerSentry Cluster: {cluster}'" "$overlay"
          grep -q "description: LayerSentry supports filesystem volumes" "$overlay"
          grep -q "successMessage: 'LayerSentry can successfully connect" "$overlay"
          grep -q "'harv-log-level': Configure LayerSentry" "$overlay"
          grep -q "'harv-auto-disk-provision-paths': Specify disks" "$overlay"
          grep -q "'harv-kubeconfig-default-token-ttl-minutes': TTL in minutes applied to LayerSentry" "$overlay"
          echo 'Known operator-facing Harvester labels are overridden by LayerSentry locale entries.'
