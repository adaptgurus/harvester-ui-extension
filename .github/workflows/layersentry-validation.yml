name: LayerSentry UI Production Validation

on:
  push:
    branches:
      - main
      - release-layersentry-v1.8.2
      - 'feat/layersentry-*'
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-ui-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  quality-and-package:
    name: Source contract, lint, package, and artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install Yarn Classic
        run: |
          npm install --global yarn@1.22.22
          node --version
          yarn --version

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Validate LayerSentry source contract
        run: yarn validate:layersentry

      - name: Lint
        run: yarn lint

      - name: Build LayerSentry extension package
        run: yarn build-pkg harvester

      - name: Locate generated package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t directories < <(
            find dist-pkg -mindepth 1 -maxdepth 1 -type d -name 'harvester-*' -print | sort
          )
          if [ "${#directories[@]}" -ne 1 ]; then
            printf 'Expected exactly one generated package directory; found %s\n' "${#directories[@]}"
            printf '%s\n' "${directories[@]}"
            exit 1
          fi

          bundle_dir="${directories[0]}"
          mapfile -t bundles < <(
            find "$bundle_dir" -maxdepth 1 -type f -name '*.umd.min.js' -print | sort
          )
          if [ "${#bundles[@]}" -ne 1 ]; then
            printf 'Expected exactly one generated UMD bundle; found %s\n' "${#bundles[@]}"
            printf '%s\n' "${bundles[@]}"
            exit 1
          fi

          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"
          echo "bundle=${bundles[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate generated package and create manifest
        run: node scripts/validate-layersentry-branding.mjs --dist "${{ steps.package.outputs.bundle_dir }}"

      - name: Create package checksums
        shell: bash
        run: |
          set -euo pipefail
          find dist-pkg -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > dist-pkg/SHA256SUMS
          test -s dist-pkg/SHA256SUMS
          grep -F '"product": "LayerSentry"' dist-pkg/layersentry-branding-manifest.json
          cat dist-pkg/layersentry-branding-manifest.json
          echo 'LAYERSENTRY UI PACKAGE CHECKSUMS: PASS'

      - name: Upload qualified LayerSentry package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layersentry-ui-qualified-${{ github.run_id }}
          path: |
            dist-pkg/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  standalone-builds:
    name: Build ${{ matrix.target }} distribution
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - hosted
          - embedded

    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build selected distribution
        shell: bash
        env:
          DISABLED_EMBED_PKG: https://releases.rancher.com/harvester-ui/plugin/harvester-1.0.3.tar.gz
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            hosted)
              ./scripts/build-hosted
              ;;
            embedded)
              ./scripts/build-embedded
              ;;
            *)
              echo "Unsupported build target: ${{ matrix.target }}"
              exit 64
              ;;
          esac

      - name: Confirm non-empty build output
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            hosted)
              test -d dist
              test "$(find dist -type f | wc -l)" -gt 10
              ;;
            embedded)
              mapfile -t archives < <(
                find dist -type f \( -name '*.tar.gz' -o -name '*.tgz' \) -print
              )
              test "${#archives[@]}" -gt 0
              ;;
          esac
          echo "LayerSentry ${{ matrix.target }} build: PASS"
