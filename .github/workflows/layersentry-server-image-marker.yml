name: LayerSentry Management Server Image Marker

on:
  workflow_run:
    workflows:
      - Publish LayerSentry Management Server Image
    types:
      - completed
    branches:
      - release-layersentry-v1.8.2

permissions:
  actions: read
  contents: write

concurrency:
  group: layersentry-management-server-image-marker
  cancel-in-progress: false

jobs:
  persist-qualified-lock:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: release-layersentry-v1.8.2
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact server-image lock artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: layersentry-management-server-v1.8.2-*
          path: downloaded-lock
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify and persist qualified image lock
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          test -s downloaded-lock/layersentry-management-server-v1.8.2.lock
          test -s downloaded-lock/SHA256SUMS
          (
            cd downloaded-lock
            sha256sum --check SHA256SUMS
          )
          grep -F "source_commit=${HEAD_SHA}" downloaded-lock/layersentry-management-server-v1.8.2.lock
          grep -F 'digest_reference=ghcr.io/adaptgurus/layersentry-harvester@sha256:' downloaded-lock/layersentry-management-server-v1.8.2.lock

          mkdir -p docs/build-evidence
          cp downloaded-lock/layersentry-management-server-v1.8.2.lock \
            docs/build-evidence/layersentry-management-server-v1.8.2.lock

          cat > docs/build-evidence/layersentry-management-server-v1.8.2.md <<EOF
          # Qualified LayerSentry management-server image

          - Product: LayerSentry
          - Compatibility base: rancher/harvester:v1.8.2
          - UI source commit: ${HEAD_SHA}
          - Image workflow run: ${RUN_ID}
          - Workflow URL: ${RUN_URL}
          - Lock file: docs/build-evidence/layersentry-management-server-v1.8.2.lock

          The lock file contains the immutable image tag and digest reference.
          The image was built only from a successful qualified LayerSentry UI
          delivery and was inspected after push for the LayerSentry product name,
          Operations Control Plane marker, and exact source-commit metadata.

          This evidence does not claim installation on a running cluster. The
          offline bundle, ISO composition, rollout, and browser verification are
          separate controlled gates.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/build-evidence/layersentry-management-server-v1.8.2.lock \
            docs/build-evidence/layersentry-management-server-v1.8.2.md

          if git diff --cached --quiet; then
            echo 'Qualified management-server image evidence is already current.'
            exit 0
          fi

          git commit -m "ci(layersentry): lock management server image for ${HEAD_SHA}"
          git push origin HEAD:release-layersentry-v1.8.2
