name: FOSSA Scanning

on:
  push:
    branches: ["main", "release-harvester-v*"]
  workflow_dispatch:

jobs:
  upstream-fossa-scanning:
    name: Upstream FOSSA scan
    if: github.repository == 'harvester/harvester-ui-extension'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The FOSSA token is owned by the upstream Harvester organization and is
      # intentionally read only when this workflow runs in that repository.
      - name: Read upstream FOSSA token
        uses: rancher-eio/read-vault-secrets@d266f55186f80a893839f6e15662e67388e443e6 # v3
        with:
          secrets: |
            secret/data/github/org/harvester/fossa/credentials token | FOSSA_API_KEY_PUSH_ONLY

      - name: FOSSA scan
        uses: fossas/fossa-action@ff70fe9fe17cbd2040648f1c45e8ec4e4884dcf3 # v1.9.0
        with:
          api-key: ${{ env.FOSSA_API_KEY_PUSH_ONLY }}
          run-tests: false

  layersentry-fork-boundary:
    name: LayerSentry fork dependency-scanning boundary
    if: github.repository != 'harvester/harvester-ui-extension'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm non-secret fork behavior
        run: |
          echo 'The upstream Harvester FOSSA token is not requested by this fork.'
          echo 'LayerSentry source, lint, package, generated-bundle, hosted, and embedded build checks remain enforced by the production-validation workflow.'
          echo 'A LayerSentry-owned software-composition-analysis credential may be connected later without weakening current build qualification.'
          echo 'LAYERSENTRY FORK FOSSA BOUNDARY: PASS'
