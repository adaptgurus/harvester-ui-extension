name: Build Standalone on PR Merge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release-harvester-v*'
      - '*-dev'
  pull_request:
    branches:
      - main
      - 'release-harvester-v*'
      - '*-dev'
    types:
      - merged

jobs:
  build-validation:
    name: Build Test
    uses: ./.github/workflows/run-lint.yaml

  upstream-publish:
    name: Upstream Build and Upload Package
    if: github.repository == 'harvester/harvester-ui-extension'
    uses: ./.github/workflows/build-and-publish-standalone.yaml
    needs:
      - build-validation
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      CI_BRANCH: ${{ github.ref_name }}

  fork-publish-boundary:
    name: LayerSentry fork publishing boundary
    if: github.repository != 'harvester/harvester-ui-extension'
    needs:
      - build-validation
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm fork-owned qualification path
        run: |
          echo 'Upstream Rancher GCS publishing is intentionally disabled for this fork.'
          echo 'LayerSentry packages are built, validated, checksummed, and retained by the LayerSentry UI Production Validation workflow.'
          echo 'LAYERSENTRY FORK PUBLISHING BOUNDARY: PASS'

  comment-on-pr:
    name: Comment upstream build result on PR
    if: github.repository == 'harvester/harvester-ui-extension' && github.event_name == 'workflow_dispatch'
    needs:
      - upstream-publish
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add build artifact comment to the PR opened from this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then
            DIR="latest"
          else
            DIR=$(printf '%s' "$BRANCH" | sed -E 's/[^a-zA-Z0-9.-]+/-/g')
          fi
          URL="https://releases.rancher.com/harvester-ui/dashboard/${DIR}/index.html"

          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for branch $BRANCH, skipping comment."
            exit 0
          fi

          BODY=$(printf '🚀 **UI Artifact Build Status:** `SUCCESS` ✅\n> ui-index: %s\n> ui-source: external' "$URL")
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
