name: LayerSentry Apply Production Operations UI

on:
  push:
    branches:
      - feat/layersentry-ui-production-readiness
    paths:
      - '.github/layersentry-ui-requests/*.json'

permissions:
  contents: write

concurrency:
  group: layersentry-apply-production-operations-ui
  cancel-in-progress: false

jobs:
  apply:
    name: Apply guarded LayerSentry operations UI migration
    if: github.repository == 'adaptgurus/harvester-ui-extension'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate unique production UI request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requests < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '.github/layersentry-ui-requests/*.json'
          )
          if [ "${#requests[@]}" -ne 1 ]; then
            printf 'Expected exactly one LayerSentry UI request; found %s\n' "${#requests[@]}"
            printf '%s\n' "${requests[@]}"
            exit 64
          fi

          expected='.github/layersentry-ui-requests/20260903-production-operations-ui.json'
          if [ "${requests[0]}" != "$expected" ]; then
            echo "Unexpected request path: ${requests[0]}"
            exit 64
          fi

          REQUEST_PATH="$expected" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const request = JSON.parse(readFileSync(process.env.REQUEST_PATH, 'utf8'));
          const exact = {
            schemaVersion: '1.0',
            requestId: 'layersentry-production-operations-ui-20260903',
            operation: 'APPLY_PRODUCTION_OPERATIONS_UI',
            targetBranch: 'feat/layersentry-ui-production-readiness',
            productName: 'LayerSentry',
            credentialMaterialUsed: false,
            clusterMutationAuthorized: false,
          };

          for (const [key, value] of Object.entries(exact)) {
            if (request[key] !== value) {
              throw new Error(`Request binding failed for ${ key }`);
            }
          }
          NODE

      - name: Apply idempotent source migration
        run: node scripts/apply-layersentry-operations-ui.mjs

      - name: Validate operations UI and credential isolation
        run: node scripts/validate-layersentry-operations-ui.mjs

      - name: Verify clean patch structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit production UI source
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            package.json
            pkg/harvester/components/HarvesterUpgradeHeader.vue
            pkg/harvester/l10n/layersentry-en-us.yaml
            pkg/harvester/list/harvesterhci.io.dashboard.vue
            pkg/harvester/styles/layersentry/_components.scss
            pkg/harvester/styles/layersentry/_theme.scss
            pkg/harvester/styles/layersentry/_tokens.scss
          )
          git add -- "${paths[@]}"

          if git diff --cached --quiet; then
            echo 'LayerSentry operations UI migration is already applied.'
            exit 0
          fi

          git config user.name 'LayerSentry UI Automation'
          git config user.email '73125939+adaptgurus@users.noreply.github.com'
          git commit -m 'feat(layersentry): productionize operations UI'
          git push origin "HEAD:${GITHUB_REF_NAME}"
