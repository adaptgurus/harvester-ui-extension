layersentrySupport:
  title: LayerSentry Support
  overview:
    title: Operational support
    description: Collect the minimum evidence required for troubleshooting while keeping credentials, kubeconfig content, certificates, and other sensitive material out of screenshots, tickets, and shared artifacts.
  context:
    label: Deployment details
    cluster: Cluster
    version: Platform version
    unavailable: Not available
  actions:
    label: Support actions
    bundle:
      title: Generate a support bundle
      description: Collect platform diagnostics for an approved support case. Review the archive for sensitive information before transferring it.
      action: Generate support bundle
    kubeconfig:
      title: Download administrative kubeconfig
      description: Download administrative access only for an approved maintenance task. Store it securely and remove it when the task is complete.
      action: Download kubeconfig
    readiness:
      title: Production-readiness checks
      description: Confirm the following controls before declaring the environment ready for service.
      nodes: All required nodes are Ready and stable after reboot.
      storage: Storage replicas, disks, and capacity are healthy.
      network: Management, virtual-machine, and service networking pass connectivity checks.
      backup: Backup targets, restore procedures, and retention controls have been validated.
    changeControl:
      title: Change-control boundary
      description: Perform upgrades, node replacement, certificate work, storage changes, and recovery operations only through an approved procedure with current evidence.
      warning: Never place passwords, tokens, kubeconfig content, or private keys in a support artifact.
  diagnostics:
    title: Advanced diagnostics
    description: These interfaces are visible only in developer mode and must not be used for routine administration.
    management:
      title: Management-plane diagnostics
      description: Inspect low-level controllers and resources under change control.
    storage:
      title: Storage diagnostics
      description: Inspect low-level storage state under change control.
  security:
    title: 'Security:'
    description: Support bundles and administrative kubeconfigs can contain sensitive infrastructure information. Handle them as restricted operational data.

typeDescription:
  harvester: Branding allows administrators to customize the LayerSentry product name, logos, favicon, and color scheme.

advancedSettings:
  descriptions:
    branding: Branding allows administrators to customize the LayerSentry product name, logos, favicon, and color scheme.
    'harv-log-level': Configure the LayerSentry server log level. Defaults to Info.
    'harv-server-version': Underlying platform server version used for LayerSentry compatibility reporting.
    'harv-upgrade-checker-enabled': Specifies whether the underlying platform upgrade check is enabled. Defaults to True.
    'harv-upgrade-checker-url': Upgrade-check endpoint used by the underlying platform. Used only when upgrade-checker-enabled is True.
    'harv-ui-source': Configure how the LayerSentry UI source is loaded. External loads the UI from a configured UI index; Bundled loads it from the local platform server.
    'harv-http-proxy': HTTP proxy used by LayerSentry to access external services.
    'harv-auto-disk-provision-paths': Specify disks using a glob pattern that LayerSentry automatically adds as virtual-machine storage.
    'harv-release-download-url': Configure the approved release-metadata endpoint used by LayerSentry to obtain release details, ISO locations, and checksums.
    'harv-auto-rotate-rke2-certs': Certificate rotation relies on the embedded management plane. LayerSentry updates certificate generations to trigger rotation when required.
    'harv-kubeconfig-default-token-ttl-minutes': TTL in minutes applied to LayerSentry administrative kubeconfig files. Default is 0, which means tokens never expire.
