    descriptions:
      'harvester-system/vm-import-controller': The virtual-machine import controller migrates workloads from supported source environments into an existing LayerSentry cluster.
      'harvester-system/pcidevices-controller': The PCI-device controller discovers LayerSentry node devices and prepares approved devices for passthrough to virtual machines and guest clusters.
      'cattle-logging-system/rancher-logging': The logging add-on collects LayerSentry logs, events, and audit records and routes them to configured destinations.
      'cattle-monitoring-system/rancher-monitoring': The monitoring add-on collects LayerSentry cluster and virtual-machine metrics for dashboards and alerting.
      'vm-import-controller': The virtual-machine import controller migrates workloads from supported source environments into an existing LayerSentry cluster.
      'pcidevices-controller': The PCI-device controller discovers LayerSentry node devices and prepares approved devices for passthrough to virtual machines and guest clusters.
      'nvidia-driver-toolkit': The NVIDIA driver toolkit enables approved vGPU devices for LayerSentry virtual machines.
      'rancher-logging': The logging add-on collects LayerSentry logs, events, and audit records and routes them to configured destinations.
      'rancher-monitoring': The monitoring add-on collects LayerSentry cluster and virtual-machine metrics for dashboards and alerting.
    vmImport:
      provider:
        requirementsText: To migrate virtual machines from VMware, use a vCenter Server 6.5 or later with an account that has at least read permissions. The source environment must be network-accessible from a LayerSentry node.
      dashboard:
        description: Migrate virtual machines from VMware vSphere to LayerSentry using cold migration for data consistency. Create a migration plan to select virtual machines, map networks and storage, and prepare the migration.
      configureMappings:
        description: Map VMware networks and datastores to LayerSentry target resources
        networkMapping:
          description: Map VMware port groups to LayerSentry networks
          placeholder: Choose a LayerSentry network
        storageMapping:
          description: Map VMware datastores to LayerSentry storage classes
          placeholder: Choose a LayerSentry storage class
  pci:
    noPermission: Contact your system administrator to add the required LayerSentry add-ons first.
  vgpu:
    noPermission: Contact your system administrator to add the required LayerSentry add-ons first.
  usb:
    noPermission: Contact your system administrator to add the required LayerSentry add-ons first.

