        successMessage: 'LayerSentry can successfully connect to the endpoint {endpoint}'
  clusterRegistrationUrl:
    tip:
      prefix: 'LayerSentry secures cluster registration through TLS by default. If you opt out of "Insecure Skip TLS Verify", you must provide custom CA certificates using the'
    message: To completely unset the imported cluster, also remove it from the embedded virtualization-management interface.
