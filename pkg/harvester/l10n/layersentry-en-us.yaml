    noPermission: Please contact your system administrator to add LayerSentry add-ons first.

typeDescription:
  harvester: Branding allows administrators to customize the LayerSentry product name, logos, and color scheme.

advancedSettings:
  descriptions:
    branding: Branding allows administrators to customize the LayerSentry product name, logos, and color scheme.
    'harv-log-level': Configure LayerSentry server log level. Defaults to Info.
    'harv-server-version': Underlying platform server version used for LayerSentry compatibility reporting.
    'harv-upgrade-checker-enabled': Specifies whether the underlying platform upgrade check is enabled. Defaults to True.
    'harv-upgrade-checker-url': Upgrade-check endpoint used by the underlying platform. Used only when upgrade-checker-enabled is True.
    'harv-ui-source': Configure how the LayerSentry UI source is loaded. External loads the UI from a ui-index URL; Bundled loads it from the local platform server.
    'harv-http-proxy': HTTP proxy used by LayerSentry to access external services.
    'harv-auto-disk-provision-paths': Specify disks using a glob pattern that LayerSentry automatically adds as virtual machine storage.
    'harv-release-download-url': Configure the upgrade release download URL used by LayerSentry to obtain release metadata, ISO locations, and checksums.
    'harv-auto-rotate-rke2-certs': Certificate rotation relies on the embedded management plane. LayerSentry updates certificate generations to trigger rotation when required.
    'harv-kubeconfig-default-token-ttl-minutes': TTL in minutes applied to LayerSentry administration kubeconfig files. Default is 0, which means tokens never expire.
